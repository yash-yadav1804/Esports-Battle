services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: esports_battle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d esports_battle"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/esports_battle
      JWT_SECRET: change-this-for-real-use
      CLIENT_URL: http://localhost:5173
      ENVIRONMENT: development
      API_PREFIX: /api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
